name: Auto Update Stock Data

on:
    workflow_dispatch:
    schedule:
        - cron: '30 6 * * *'

permissions:
  contents: write
    
#   push:
#     branches:
#       - feature/auto-update  # Add any branch you want it to run on
#   workflow_dispatch:       # Allows manual trigger from the GitHub UI
#   schedule:
#     - cron: '0 0 */3 * *'  # Runs every 3 days at 00:00 UTC

jobs:
  run-auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: feature/auto-update

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (if needed)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Run Testing Script
        env:
            TOKEN: ${{ secrets.TOKEN }}
            PWD: ${{ secrets.PWD }}
            USER_ID: ${{ secrets.USER_ID }}
        run: |
            echo '${{ secrets.FIRESTORE_CREDENTIALS }}' > 'firestore-credential.json'
            python "Data Stream/auto_update.py"

      - name: Commit and push status file
        run: |
          git config user.name "wavelolz"
          git config user.email "rayhsu005@gmail.com"
          
          git add status.txt
          git commit -m "Update status.txt from GitHub Actions"
          git push origin feature/auto-update

